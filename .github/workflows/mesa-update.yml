name: Auto PR from upstream Mesa

on:
  workflow_dispatch:       # 支持手动触发

permissions:
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout your repository (Main branch)
        uses: actions/checkout@v4
        with:
          ref: Main          # 你的默认分支是 Main（大写M）

      - name: Fetch upstream Mesa (main branch)
        run: |
          git remote add upstream https://gitlab.freedesktop.org/mesa/mesa.git
          git fetch upstream main   # 上游默认分支是 main（小写m）

      - name: Create/update upstream-sync branch with upstream/main
        run: |
          git checkout -B upstream-sync upstream/main
          git push -f origin upstream-sync

      - name: Create Pull Request towards Main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: upstream-sync
          base: Main          # 目标分支是你的 Main
          title: "⬆️ Auto PR: sync from upstream Mesa (main)"
          body: |
            自动从 [Mesa 上游](https://gitlab.freedesktop.org/mesa/mesa) 的 `main` 分支同步到本仓库的 `upstream-sync` 分支。

            ⚠️ 请手动审查合并，如有冲突请在本机解决后合并。
          delete-branch: false   # 保留分支，以便下次更新覆盖
