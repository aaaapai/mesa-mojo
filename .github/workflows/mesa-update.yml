name: Sync upstream Mesa branch

on:
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write          # 只需要写入代码的权限

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          # 这里不需要默认分支，因为我们会独立创建/更新分支
          fetch-depth: 0     # 获取所有历史以便后续推送

      - name: Fetch upstream Mesa (main branch)
        run: |
          git remote add upstream https://gitlab.freedesktop.org/mesa/mesa.git
          git fetch upstream main

      - name: Create/force-update branch 'upstream-mesa' from upstream/main
        run: |
          # 直接基于上游 main 创建/重置本地分支 upstream-mesa
          git checkout -B upstream-mesa upstream/main
          # 强制推送到 origin，覆盖远程同名分支
          git push origin upstream-mesa --force

      - name: (Optional) Log commit hash for verification
        run: |
          echo "Updated upstream-mesa to commit:"
          git rev-parse upstream-mesa
