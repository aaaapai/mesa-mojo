# .github/workflows/check-upstream.yml
name: Check Upstream Mesa and Create PR on Failure

on:
  workflow_dispatch:

# 关键权限配置，必须授予写入 pull-requests 的权限[reference:8]
permissions:
  pull-requests: write

jobs:
  # 主任务：尝试同步上游代码
  Sync:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Pull changes from upstream Mesa repository
        run: |
          git remote add upstream https://gitlab.freedesktop.org/mesa/mesa.git
          git fetch upstream
          git checkout -b upstream-sync
          git merge upstream/main --allow-unrelated-histories -m "Merge upstream Mesa changes"

      # 关键：推送合并后的更新到当前仓库
      - name: Push updates to repository
        run: git push origin upstream-sync

  # 条件任务：仅当 Sync job 失败时创建 PR[reference:9]
  Create-PR-on-Failure:
    needs: [Sync]
    if: failure()
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: upstream-sync

      # 使用 peter-evans/create-pull-request action 创建 PR
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }} # 推荐使用 Personal Access Token (classic) 以兼容私有仓库
          commit-message: "chore: sync from upstream Mesa (failed)"
          title: "⚠️ [AUTO] Failed to sync from upstream Mesa"
          body: |
            The automated sync job from [Mesa upstream](https://gitlab.freedesktop.org/mesa) has failed.
            
            Please investigate the cause of the failure and resolve it manually.
          branch: upstream-sync
          base: main
          delete-branch: true # PR 合并后删除源分支
